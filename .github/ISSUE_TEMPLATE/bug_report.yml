name: Bug report / Ошибка
description: Something does not work / Что-то не работает
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: whoohub version / Версия whoohub
      description: Menu → About whoohub / Меню → О whoohub
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop / Дистрибутив и рабочий стол
      placeholder: "Arch Linux, KDE Plasma 6 / EndeavourOS, qtile …"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened / Что произошло
      description: What you did, what you expected, what happened instead / Что делал, чего ждал, что вышло
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log / Лог
      description: For a failed install — the text under "Details"; for a crash — what `whoohub` prints in a terminal / Для неудачной установки — текст из «Подробности»; при вылете — вывод `whoohub` в терминале
      render: text
